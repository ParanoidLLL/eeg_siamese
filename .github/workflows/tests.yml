name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test,monitor]" build
      - run: python -m pytest -q
      - run: python -m build
      - name: Check wheel resources
        run: |
          python -c "import glob, zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert 'eeg_siamese/configs/axial_transformer.json' in z.namelist()"
      - name: Capture CI environment
        if: always()
        run: python scripts/capture_environment.py --output artifacts/ci-environment.json
      - name: Upload CI environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-environment
          path: artifacts/ci-environment.json
