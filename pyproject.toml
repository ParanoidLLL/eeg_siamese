[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-siamese"
version = "0.1.0"
description = "Quality-aware axial EEG identity encoder, enrollment and matching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
monitor = ["tensorboard>=2.14,<3", "matplotlib>=3.8,<4", "pillow>=10,<13"]

[project.scripts]
eeg-siamese = "eeg_siamese.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eeg_siamese = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

